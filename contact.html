<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - Kiel_Dev</title>
  <link rel="stylesheet" href="./index.css" />
</head>
<body>
<nav class="navbar">
  <div class="nav-container">
    <h1 class="logo">Kiel_Dev</h1>
    <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
      ☰
    </button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </div>
</nav>


  <main class="contact-container">
    <h1>Contact Us</h1>

<form action="https://formspree.io/f/meorbwgj" method="POST" data-testid="test-contact-form" id="contact-form" novalidate>
  <div class="form-group">
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" data-testid="test-contact-name" aria-describedby="error-name" required>
    <small id="test-contact-error-name" class="error-msg" aria-live="polite"></small>
  </div>

  <div class="form-group">
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" data-testid="test-contact-email" aria-describedby="error-email" required>
    <small id="test-contact-error-email" class="error-msg" aria-live="polite"></small>
  </div>

  <div class="form-group">
    <label for="subject">Subject:</label>
    <input type="text" id="subject" name="subject" data-testid="test-contact-subject" aria-describedby="error-subject" required>
    <small id="test-contact-error-subject" class="error-msg" aria-live="polite"></small>
  </div>

  <div class="form-group">
    <label for="message">Message:</label>
    <textarea id="message" name="message" data-testid="test-contact-message" aria-describedby="error-message" required></textarea>
    <small id="test-contact-error-message" class="error-msg" aria-live="polite"></small>
  </div>

  <div id="form-status" role="status" aria-live="polite" class="form-status" hidden></div>
  <button id="submit-btn" type="submit" data-testid="test-contact-submit">Submit</button>
  <p id="success-message" data-testid="test-contact-success" aria-live="assertive" hidden>
    ✅ Your message has been sent successfully!
  </p>
</form>
  </main>

  <script src="./contact.js"></script>
<script src="./nav.js"></script>

</body>
</html>
